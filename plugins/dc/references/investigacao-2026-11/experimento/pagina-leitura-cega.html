<title>Leitura cega</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Public+Sans:wght@400;600;700&display=swap">
<style>
/* layout: one reading column; the guide text sits on paper, the forms sit on the ground */
:root { --bg: #f1efe9; --paper: #fffdf8; --fg: #1f1d19; --muted: #645f55; --line: #d9d4c8; --accent: #1d5c7a; --accent-ink: #ffffff; --mark: #f3dd8a; --ok: #2d6a4f; --font-text: "Source Serif 4", Georgia, "Times New Roman", serif; --font-ui: "Public Sans", system-ui, -apple-system, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #171613; --paper: #22201b; --fg: #ece8df; --muted: #a8a295; --line: #3a372f; --accent: #7fb6d3; --accent-ink: #0f1a20; --mark: #6b5a1c; --ok: #7fc8a4; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #171613; --paper: #22201b; --fg: #ece8df; --muted: #a8a295; --line: #3a372f; --accent: #7fb6d3; --accent-ink: #0f1a20; --mark: #6b5a1c; --ok: #7fc8a4; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 17px; line-height: 1.55; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; }
main { max-width: 42rem; margin: 0 auto; display: grid; gap: 20px; }
main > * { min-width: 0; }
.card { min-width: 0; overflow-wrap: anywhere; }
h1 { font-family: var(--font-ui); font-size: 1.6rem; line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-size: 1.2rem; margin: 0 0 8px; text-wrap: balance; }
p { margin: 0 0 10px; }
.eyebrow { font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
.card > :last-child { margin-bottom: 0; }
.paper { font-family: var(--font-text); font-size: 1.12rem; line-height: 1.6; }
.paper h1 { font-family: var(--font-text); font-size: 1.7rem; margin: 0 0 16px; }
.paper h2 { font-family: var(--font-text); font-size: 1.35rem; margin: 28px 0 10px; }
.paper h3 { font-family: var(--font-text); font-size: 1.15rem; margin: 22px 0 8px; }
.paper p, .paper li { cursor: pointer; }
.paper p.trava, .paper li.trava { background: var(--mark); border-radius: 4px; box-shadow: 0 0 0 4px var(--mark); }
.paper table { border-collapse: collapse; width: 100%; font-size: .95rem; display: block; overflow-x: auto; }
.paper th, .paper td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; }
.paper pre { background: var(--bg); padding: 10px; border-radius: 6px; overflow-x: auto; font-size: .9rem; }
.paper code { font-family: ui-monospace, Menlo, monospace; font-size: .92em; }
.paper .mermaid { overflow-x: auto; background: transparent; padding: 0; }
.paper .mermaid svg { max-width: 100%; height: auto; }
.paper img { max-width: 100%; }
button { font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
button.quiet { background: transparent; color: var(--accent); border: 1px solid var(--line); }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button[disabled] { opacity: .5; cursor: default; }
textarea, input[type=text] { font: inherit; width: 100%; box-sizing: border-box; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
textarea { min-height: 84px; resize: vertical; }
.escala { display: flex; gap: 8px; flex-wrap: wrap; }
.escala label { flex: 1 1 60px; text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 10px 4px; cursor: pointer; background: var(--paper); font-size: .9rem; }
.escala input { display: none; }
.escala label.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--muted); font-size: .92rem; }
.pill { display: inline-block; font-size: .8rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.ok { color: var(--ok); font-weight: 600; }
.sticky { position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); padding: 8px 0; z-index: 2; border-bottom: 1px solid var(--line); }
pre.copia { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: .8rem; max-height: 220px; overflow: auto; }
@media (prefers-reduced-motion: no-preference) { .card { transition: background .2s } }
</style>
<main id="app">
  <div class="card"><p>Carregando o experimento...</p></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script>
(() => {
  const app = document.getElementById('app');
  const LS = 'leitura-cega-v1';
  let dados = null, estado = null, db = null, usuario = null;

  const salvoLocal = () => { try { return JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { return null; } };
  const guardaLocal = () => { try { localStorage.setItem(LS, JSON.stringify(estado)); } catch (e) {} };
  const agora = () => new Date().toISOString();
  const novoId = () => 'p-' + Math.random().toString(36).slice(2, 10) + '-' + Date.now().toString(36);
  function embaralha(arr, seed) {
    // deterministic shuffle from the participant id, so a reload keeps the same order
    let s = 0; for (const c of seed) s = (s * 31 + c.charCodeAt(0)) >>> 0;
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { s = (s * 1103515245 + 12345) >>> 0; const j = s % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  async function guarda() {
    estado.atualizado = agora();
    guardaLocal();
    if (db) {
      try { const id = usuario ? await usuario.id() : estado.pid; estado.docId = id; await db.doc('respostas/' + id).set(estado); estado.gravado = true; }
      catch (e) { estado.gravado = false; estado.erroGravacao = (e && e.code) || 'erro'; }
    }
  }

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) { if (k === 'class') el.className = v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else if (k === 'html') el.innerHTML = v; else el.setAttribute(k, v); }
    for (const kid of kids) if (kid != null) el.append(kid);
    return el;
  }
  const render = (...nodes) => { app.replaceChildren(...nodes); window.scrollTo({ top: 0 }); };

  function planoDoParticipante() {
    const ordemPares = embaralha(dados.pares.map(p => p.id), estado.pid + 'pares');
    const plano = [];
    for (const pid of ordemPares) {
      const par = dados.pares.find(p => p.id === pid);
      const versoes = embaralha(Object.keys(par.versoes), estado.pid + pid);
      const perguntas = embaralha(par.perguntas.map(q => q.id), estado.pid + 'q' + pid);
      const metade = Math.ceil(perguntas.length / 2);
      plano.push({ par: pid, versoes, perguntas: { [versoes[0]]: perguntas.slice(0, metade), [versoes[1]]: perguntas.slice(metade) } });
    }
    return plano;
  }

  function telaInicio() {
    const salvo = salvoLocal();
    const nome = h('input', { type: 'text', id: 'nome', placeholder: 'Iniciais ou apelido (opcional)' });
    const comeca = () => {
      estado = { pid: novoId(), nome: nome.value.trim(), inicio: agora(), conta: !!db, passo: 0, leituras: {}, comparacoes: {}, recordacao24h: {}, versao: 1 };
      estado.plano = planoDoParticipante();
      guarda().then(() => telaPasso());
    };
    render(
      h('div', { class: 'card' },
        h('p', { class: 'eyebrow' }, 'Experimento de leitura'),
        h('h1', {}, 'Dois textos sobre o mesmo assunto. Qual cansa menos?'),
        h('p', {}, 'Você vai ler quatro textos curtos, dois sobre cada assunto. Depois de cada texto, três perguntas rápidas e uma nota de esforço. Leva uns 25 minutos. Não existe resposta certa sobre o esforço: a sua sensação é o dado.'),
        h('p', {}, 'Amanhã, um dia depois, a página pede as mesmas perguntas de novo, sem os textos. Volte por este mesmo link, no mesmo navegador.'),
        h('p', { class: 'muted' }, db ? 'Suas respostas ficam guardadas nesta página, ligadas à sua conta.' : 'Suas respostas ficam neste navegador. No fim, a página mostra um bloco de texto para você copiar e enviar ao Dennis.'),
        nome,
        h('div', { class: 'row', style: 'margin-top:12px' }, h('button', { onclick: comeca }, 'Começar'),
          salvo && salvo.pid ? h('button', { class: 'quiet', onclick: () => { estado = salvo; telaPasso(); } }, 'Continuar de onde parei') : null)));
  }

  function etapaAtual() {
    // steps: for each pair: read v1, form v1, read v2, form v2, compare; then end
    const passos = [];
    for (const item of estado.plano) {
      for (const v of item.versoes) { passos.push({ tipo: 'ler', par: item.par, versao: v }); passos.push({ tipo: 'form', par: item.par, versao: v }); }
      passos.push({ tipo: 'comparar', par: item.par });
    }
    passos.push({ tipo: 'fim' });
    return passos[Math.min(estado.passo, passos.length - 1)];
  }

  function telaPasso() {
    const e = etapaAtual();
    if (e.tipo === 'ler') return telaLer(e);
    if (e.tipo === 'form') return telaForm(e);
    if (e.tipo === 'comparar') return telaComparar(e);
    return telaFim();
  }

  function mdParaHtml(md) {
    let html = marked.parse(md, { mangle: false, headerIds: false });
    // Mermaid fences become native diagrams
    html = html.replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g, (m, code) => '<pre class="mermaid">' + code.replace(/&gt;/g, '>').replace(/&lt;/g, '<').replace(/&amp;/g, '&') + '</pre>');
    return html;
  }

  function desenhaMermaid(root) {
    // The host renders Mermaid only for content present at load, so dynamic content uses the library.
    if (!window.mermaid) return;
    const dark = matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme !== 'light' || document.documentElement.dataset.theme === 'dark';
    try {
      mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral', securityLevel: 'strict' });
      const nodes = root.querySelectorAll('pre.mermaid');
      if (nodes.length) mermaid.run({ nodes }).catch(() => {});
    } catch (e) {}
  }

  function telaLer(e) {
    const par = dados.pares.find(p => p.id === e.par);
    const texto = par.versoes[e.versao];
    const chave = e.par + ':' + e.versao;
    const leitura = estado.leituras[chave] || (estado.leituras[chave] = { abriu: agora(), travas: [] });
    const paper = h('div', { class: 'card paper', html: mdParaHtml(texto) });
    desenhaMermaid(paper);
    paper.querySelectorAll('p, li').forEach((el, i) => {
      if (leitura.travas.includes(i)) el.classList.add('trava');
      el.addEventListener('click', () => { el.classList.toggle('trava'); const on = el.classList.contains('trava'); leitura.travas = on ? [...new Set([...leitura.travas, i])] : leitura.travas.filter(x => x !== i); guardaLocal(); });
    });
    const n = estado.plano.findIndex(x => x.par === e.par) * 2 + estado.plano.find(x => x.par === e.par).versoes.indexOf(e.versao) + 1;
    render(
      h('div', { class: 'sticky row' }, h('span', { class: 'pill' }, 'Texto ' + n + ' de ' + (estado.plano.length * 2)), h('span', { class: 'muted' }, 'Toque num parágrafo onde você travou ou releu. Toque de novo para desmarcar.')),
      paper,
      h('div', { class: 'card row' }, h('button', { onclick: () => { leitura.terminou = agora(); estado.passo++; guarda().then(telaPasso); } }, 'Terminei de ler')));
  }

  function escala(nome, rotulos) {
    const wrap = h('div', { class: 'escala' });
    rotulos.forEach((r, i) => {
      const inp = h('input', { type: 'radio', name: nome, value: String(i + 1) });
      const lab = h('label', {}, inp, r);
      lab.addEventListener('click', () => { wrap.querySelectorAll('label').forEach(l => l.classList.remove('on')); lab.classList.add('on'); inp.checked = true; });
      wrap.append(lab);
    });
    wrap.valor = () => { const c = wrap.querySelector('input:checked'); return c ? Number(c.value) : null; };
    return wrap;
  }

  function telaForm(e) {
    const par = dados.pares.find(p => p.id === e.par);
    const chave = e.par + ':' + e.versao;
    const leitura = estado.leituras[chave];
    const esforco = escala('esforco', ['1 nenhum', '2 pouco', '3 algum', '4 bastante', '5 muito']);
    const releu = escala('releu', ['Nenhuma', 'Uma', 'Duas ou três', 'Várias']);
    const travou = h('textarea', { placeholder: 'Onde você travou, releu ou se perdeu? Pode citar um trecho.' });
    const ids = estado.plano.find(x => x.par === e.par).perguntas[e.versao];
    const campos = ids.map(id => { const q = par.perguntas.find(x => x.id === id); return { q, ta: h('textarea', { placeholder: 'Responda com o que lembra. "Não lembro" também é resposta.' }) }; });
    const envia = () => {
      if (esforco.valor() == null) { aviso.textContent = 'Marque o esforço antes de seguir.'; return; }
      leitura.esforco = esforco.valor(); leitura.releu = releu.valor(); leitura.travouTexto = travou.value.trim();
      leitura.respostas = campos.map(c => ({ id: c.q.id, resposta: c.ta.value.trim(), em: agora() }));
      estado.passo++; guarda().then(telaPasso);
    };
    const aviso = h('p', { class: 'muted' });
    render(
      h('div', { class: 'card' }, h('p', { class: 'eyebrow' }, 'Sobre o texto que você acabou de ler'),
        h('h2', {}, 'Quanto esforço deu para acompanhar?'), esforco,
        h('h2', { style: 'margin-top:16px' }, 'Quantas vezes você voltou para reler um trecho?'), releu,
        h('h2', { style: 'margin-top:16px' }, 'Onde travou?'), travou),
      h('div', { class: 'card' }, h('p', { class: 'eyebrow' }, 'Sem voltar ao texto'),
        ...campos.flatMap(c => [h('h2', {}, c.q.prompt), c.q.cue ? h('p', { class: 'muted' }, c.q.cue) : null, c.ta]),
        aviso,
        h('div', { class: 'row', style: 'margin-top:12px' }, h('button', { onclick: envia }, 'Enviar e seguir'))));
  }

  function telaComparar(e) {
    const item = estado.plano.find(x => x.par === e.par);
    const qual = escala('qual', ['O primeiro', 'O segundo', 'Deu igual']);
    const porque = h('textarea', { placeholder: 'Em uma frase: por quê?' });
    const envia = () => {
      if (qual.valor() == null) { aviso.textContent = 'Escolha uma opção.'; return; }
      estado.comparacoes[e.par] = { menosEsforco: qual.valor() === 3 ? 'igual' : item.versoes[qual.valor() - 1], porque: porque.value.trim(), em: agora() };
      estado.passo++; guarda().then(telaPasso);
    };
    const aviso = h('p', { class: 'muted' });
    render(h('div', { class: 'card' }, h('p', { class: 'eyebrow' }, 'Os dois textos sobre o mesmo assunto'),
      h('h2', {}, 'Qual dos dois exigiu menos esforço para entender?'), qual,
      h('h2', { style: 'margin-top:16px' }, 'Por quê?'), porque, aviso,
      h('div', { class: 'row', style: 'margin-top:12px' }, h('button', { onclick: envia }, 'Seguir'))));
  }

  function blocoCopia() {
    const texto = JSON.stringify(estado);
    const pre = h('pre', { class: 'copia' }, texto);
    const btn = h('button', { class: 'quiet', onclick: async () => { try { await navigator.clipboard.writeText(texto); btn.textContent = 'Copiado'; } catch (e) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = 'Selecionado: use copiar'; } } }, 'Copiar as respostas');
    return h('div', { class: 'card' }, h('p', { class: 'eyebrow' }, 'Suas respostas, para enviar'), h('p', {}, 'Copie este bloco e mande ao Dennis por mensagem. Ele cola na análise.'), btn, pre);
  }

  function telaFim() {
    estado.fim = estado.fim || agora();
    const devolve = new Date(new Date(estado.fim).getTime() + 24 * 3600 * 1000);
    const pronto24 = Date.now() >= devolve.getTime();
    const feito24 = Object.keys(estado.recordacao24h).length > 0;
    const nodes = [h('div', { class: 'card' }, h('p', { class: 'eyebrow' }, 'Obrigado'),
      h('h1', {}, feito24 ? 'Tudo respondido, inclusive a volta de um dia depois.' : 'Terminou a primeira parte.'),
      h('p', {}, estado.gravado ? h('span', { class: 'ok' }, 'Respostas guardadas nesta página.') : (db ? 'A gravação falhou; copie o bloco abaixo.' : 'Suas respostas estão neste navegador.')),
      feito24 ? null : h('p', {}, 'Volte por este mesmo link, neste navegador, a partir de ' + devolve.toLocaleString('pt-BR') + '. A página vai pedir as mesmas perguntas, sem os textos, para medir o que ficou.'),
      (pronto24 && !feito24) ? h('button', { onclick: telaRecordacao }, 'Responder a volta de um dia depois') : null)];
    if (!estado.gravado) nodes.push(blocoCopia());
    render(...nodes);
    guarda();
  }

  function telaRecordacao() {
    const campos = [];
    for (const item of estado.plano) {
      const par = dados.pares.find(p => p.id === item.par);
      for (const q of par.perguntas) campos.push({ par: item.par, q, ta: h('textarea', { placeholder: 'O que ficou? "Não lembro" também é resposta.' }) });
    }
    const envia = () => {
      campos.forEach(c => { estado.recordacao24h[c.par + ':' + c.q.id] = { resposta: c.ta.value.trim(), em: agora() }; });
      guarda().then(telaFim);
    };
    render(h('div', { class: 'card' }, h('p', { class: 'eyebrow' }, 'Um dia depois, sem os textos'),
      ...campos.flatMap(c => [h('h2', {}, c.q.prompt), c.q.cue ? h('p', { class: 'muted' }, c.q.cue) : null, c.ta]),
      h('div', { class: 'row', style: 'margin-top:12px' }, h('button', { onclick: envia }, 'Enviar'))));
  }

  async function inicia() {
    try { const r = await fetch('pares.json'); dados = await r.json(); }
    catch (e) { render(h('div', { class: 'card' }, h('p', {}, 'Não foi possível carregar os textos. Recarregue a página.'))); return; }
    try {
      const use = window.claude && window.claude.use;
      if (use) {
        const timer = new Promise(res => setTimeout(() => res(null), 10000));
        db = await Promise.race([use('db'), timer]);
        usuario = await Promise.race([use('user'), timer]);
      }
    } catch (e) { db = null; }
    const salvo = salvoLocal();
    if (salvo && salvo.pid && salvo.fim) { estado = salvo; telaFim(); return; }
    telaInicio();
  }
  inicia();
})();
</script>
